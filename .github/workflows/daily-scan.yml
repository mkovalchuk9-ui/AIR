name: Daily TikTok Scout

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scout
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python main.py

      - name: Commit updated data (history db + site JSON)
        run: |
          git config user.name "tiktok-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.db docs/data/latest.json docs/data/runs.json
          git diff --cached --quiet || git commit -m "Update daily findings [skip ci]"
          git push
